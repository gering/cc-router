name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Setup is the only step that downloads anything; the gate itself runs
      # without network or secrets.
      # zsh runs the wrapper suites; macOS ships it, Ubuntu does not.
      - name: Install shellcheck and zsh
        run: |
          missing=""
          command -v shellcheck >/dev/null || missing="$missing shellcheck"
          command -v zsh >/dev/null || missing="$missing zsh"
          if [ -z "$missing" ]; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install $missing; else sudo apt-get update && sudo apt-get install -y $missing; fi
      - name: Fetch modules and tools
        run: |
          go mod download
          go mod download -modfile=tools/go.mod
          go build -modfile=tools/go.mod -o /dev/null honnef.co/go/tools/cmd/staticcheck mvdan.cc/sh/v3/cmd/shfmt
      - run: make check
